# Liste sport ANJ - résumé machine-readable (non officiel)
source:
  annexe_1_competitions: "https://ressources.anj.fr/sport/competitions_sportives_support_paris_autorises.pdf (et .xlsx)"
  annexe_2_types_resultats: "https://ressources.anj.fr/sport/types_resultats_phases_jeux.pdf (et .xlsx)"
  decision_de_reference: "Décision ANJ n° 2026-159 du 21 juillet 2026 (en-tête des annexes), modifiée par la décision n° 2026-167 du 17 septembre 2026 (retrait du CEV Tour en beach-volley)"
  fichiers_telecharges_le: "2026-10-02"
  avertissement: "Résumé non officiel. Seule l annexe de la décision la plus récente du collège de l ANJ fait foi. Les genres/disciplines sont agrégés ; les types de résultats sont reformulés de façon abrégée."
formes_de_paris_autorisees:
  - "pari à cote fixe (gain garanti par l opérateur, perte max = mise)"
  - "pari mutuel (masse commune partagée)"
  - "paris en direct (live) en ligne"
  - "paris combinés (forme libre chez les opérateurs ; types Fantasy réservés aux combinés mutuels >= 10 paris élémentaires, >= 5 en cyclisme)"
formes_interdites_ou_non_listees:
  - "betting exchange / paris de contrepartie entre joueurs avec cote fixée par les joueurs"
  - "spread betting et tout pari où la perte potentielle > mise"
  - "tout sport, compétition, type de résultat ou phase non listé (ex. e-sport, fléchettes, cricket, cartons/corners/fautes en football hors Fantasy mutuel)"
fantasy_mutuel_uniquement:
  regle: "Types de résultats réservés à des compétitions spécifiques et à des combinés d au moins 10 paris élémentaires (5 pour le cyclisme), sous la seule forme mutuelle ; les faits de jeu négatifs (marqués * ou **) ne peuvent profiter au parieur."
