name: Tableau de bord - quoi parier aujourd'hui

on:
  schedule:
    - cron: '7 5-21/2 * * *'     # toutes les 2 h de 05:07 à 21:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances
        run: pip install pandas numpy scipy requests pyarrow

      # historique joueur-match NHL (modèle buteurs) : saisons passées gardées en cache,
      # seule la saison en cours est retéléchargée
      - uses: actions/cache@v4
        with:
          path: data/raw/nhl_players
          key: nhl-players-${{ github.run_id }}
          restore-keys: nhl-players-

      - name: Récupérer l'historique (branche dashboard-data)
        run: |
          if git fetch --depth=1 origin dashboard-data; then
            # restaure historique, cache des cotes FR, notifications et archive des cotes
            git --work-tree=site/data checkout origin/dashboard-data -- . && git reset -q
          else
            echo "Première exécution : pas encore d'historique"
          fi

      - name: Construire le tableau de bord
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}   # optionnel (clé gratuite)
          # Abonnement The Odds API de 20 000 crédits/mois : relevé à chaque passage (9/jour),
          # 25 sports max, vainqueur/1N2 + totaux (2 crédits/sport) -> ≤ 450 crédits/jour,
          # ≤ ~14 000/mois ; arrêt automatique sous 2 000 crédits restants.
          # Offre gratuite (500/mois) : ODDS_API_HOURS '7,13,17', MAX_CALLS '5', MARKETS 'h2h'.
          ODDS_API_HOURS: 'all'
          ODDS_API_MAX_CALLS: '25'
          ODDS_API_MARKETS: 'h2h,totals'
          ODDS_API_RESERVE: '2000'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optionnel
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}       # optionnel
          SITE_URL: https://matttgic.github.io/Overstreamlit/
        run: |
          python scripts/build_dashboard.py --min-ev 0.03 --bankroll 1000
          python scripts/build_site.py

      - name: Sauvegarder les données (branche dashboard-data)
        run: |
          cd site/data
          git init -q && git checkout -q -b dashboard-data
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -qm "Données du $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dashboard-data
          rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
