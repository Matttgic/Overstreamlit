name: Daily Football Scan
on:
  schedule:
    - cron: '0 8 * * *' # 9h00 en France
  workflow_dispatch:

permissions:
  contents: write # IMPORTANT : Autorise GitHub à modifier tes fichiers

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install pandas numpy requests scipy streamlit

      - name: Run Scan
        env:
          FOOT_API_KEY: ${{ secrets.FOOT_API_KEY }}
        run: |
          # On simule un environnement streamlit pour éviter les erreurs de contexte
          python -c "import os; os.environ['STREAMLIT_RUN_MODE'] = 'bare'; import app;" 
          # Note: Si tu veux que le script soit 100% propre pour l'action, 
          # il faudrait séparer la logique de calcul de l'interface st.

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historique_paris.csv
          git commit -m "Auto-update: Pronos du jour" || echo "Aucun changement"
          git push
