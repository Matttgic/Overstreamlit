name: Scan quotidien des value bets

on:
  schedule:
    - cron: '0 7 * * *'     # tous les jours à 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances
        run: pip install pandas numpy scipy requests pyarrow

      - name: Scan (aucune clé API nécessaire)
        run: python scripts/daily_scan.py --min-ev 0.03 --model-weight 0 --books B365,BW

      - name: Commit des paris du jour
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add picks/
          git commit -m "Scan quotidien : value bets du $(date -u +%F)" && git push || echo "Rien à pousser"
